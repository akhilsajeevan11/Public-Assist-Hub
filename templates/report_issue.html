<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Issue Reporting</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <!-- <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/report_issue.css') }}"
    /> -->
    <link rel="stylesheet" href="../static/css/report_issue.css">
    <script
      src="https://maps.gomaps.pro/maps/api/js?key=AlzaSyhch38Wfq6AQeEqLX36TG2T28-V73843NL&libraries=places&callback=initMap"
      async
      defer
    ></script>

    <style></style>
  </head>
  <body>
    <div class="container mt-5">
      <h2 class="text-center">
        <i class="fas fa-exclamation-circle"></i> Report a Public Issue
      </h2>

      <div class="card p-4 mt-3">
        <form id="issueForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="issueTitle" class="form-label">
              <i class="fas"></i> Issue Title
            </label>
            <input type="text" class="form-control" id="issueTitle" required />
          </div>

          <div class="mb-3">
            <label for="issueDescription" class="form-label">
              <i class="fas fa-align-left"></i> Description
            </label>
            <textarea
              class="form-control"
              id="issueDescription"
              rows="3"
              required
            ></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">
              <i class="fas fa-image"></i> Upload Image
            </label>
            <div
              class="upload-box"
              onclick="document.getElementById('issueImage').click()"
            >
              <p>
                <i
                  class="fas fa-cloud-upload-alt fa-2x"
                  style="color: #00c4a5"
                ></i>
              </p>
              <p>Click to upload an image</p>
              <input
                type="file"
                id="issueImage"
                accept="image/*"
                onchange="previewImage(event)"
              />
              <img id="preview" class="upload-preview" />
              <i
                class="fas fa-eye view-image"
                id="viewImageBtn"
                onclick="viewImage()"
              ></i>
            </div>
          </div>

          <div class="mb-3">
            <label for="issueLocation" class="form-label">
              <i class="fas fa-map-marker-alt"></i> Location
            </label>
            <input
              type="text"
              class="form-control"
              id="issueLocation"
              placeholder="Fetching location..."
              required
            />
            <div id="map"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            <i class="fas fa-paper-plane"></i> Submit Issue
          </button>
        </form>
      </div>

      <h3 class="mt-5 text-center">
        <i class="fas fa-list"></i> Track & Feedback Reported Issues
      </h3>
      <div class="card p-3 mt-3">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Title</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="issuesTable"></tbody>
        </table>
      </div>
    </div>
    <!-- <script src="{{ url_for('static', filename='js/report_issue.js') }}"></script> -->
     <script src="../static/js/report_issue.js"></script>
  </body>
</html>
